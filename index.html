<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Caminhos do Sagrado Greco-Goiano</title>
<style>
  :root {
    --accent: #4a4a4a;
    --bg-card: #111;
    --bg-app: #2a2a2a;
    --text-white: #fff;
    --text-black: #000;
    --red: #e74c3c;
    --green: #2ecc71;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-app);
  }

  .app-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* acompanha a barra de endereço do celular aparecendo/sumindo */
    max-width: 600px;
    margin: 0 auto;
    background: var(--bg-app);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  /* ===== FAIXA DE TÍTULO (TOPO) ===== */
  .top-title-bar {
    flex: 0 0 auto;
    padding: 12px 16px 8px;
    text-align: center;
  }
  .top-title-bar h1 {
    margin: 0;
    font-size: 0.9em;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* ===== PAINEL FIXO (LOGO ABAIXO DO TÍTULO) ===== */
  .top-panel {
    flex: 0 0 auto;
    background: var(--bg-card);
    border-radius: 0 0 20px 20px;
    padding: 16px 16px 18px;
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .cover-thumb {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: #333;
  }
  .cover-thumb.hidden { display: none; }
  .now-playing-info { min-width: 0; flex: 1; }
  .track-title {
    color: var(--text-white);
    font-weight: 700;
    font-size: 1.5em;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .status-icon { font-size: 0.95em; }
  .status-text { font-size: 1.05em; font-weight: 700; }

  .status-icon.playing,
  .status-text.playing { color: var(--green); }
  .status-icon.paused,
  .status-text.paused { color: var(--red); }

  /* ===== CONTROLES PRINCIPAIS: ANTERIOR / PLAY / PRÓXIMA ===== */
  .primary-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    margin-bottom: 16px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.9em;
    line-height: 1;
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.9); }

  .play-circle-btn {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    flex-shrink: 0;
  }
  .play-circle-btn:active { transform: scale(0.95); }
  .play-circle-btn span {
    color: #000;
    font-size: 2.3em;
    line-height: 1;
    /* pequeno deslocamento para centralizar visualmente o triângulo de play */
    margin-left: 5px;
  }
  .play-circle-btn.is-playing span { margin-left: 0; }

  /* ===== VOLTAR 15s / VELOCIDADE / AVANÇAR 15s ===== */
  .skip-row {
    display: flex;
    gap: 10px;
  }

  .btn-skip {
    flex: 1;
    border: none;
    cursor: pointer;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 6px;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn-skip:active { transform: scale(0.96); background: rgba(255,255,255,0.16); }
  .btn-skip span.icon {
    font-size: 1.3em;
    line-height: 1;
  }

  .speed-btn {
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent;
    font-weight: 700;
  }

  /* ===== LISTA ROLÁVEL (RESTANTE DA TELA) ===== */
  .playlist-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }

  .track-item {
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 8px;
    color: #fff;
  }
  .track-item:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .track-item.active { background: #fff; color: #000; }
  .track-item-title { font-weight: 700; font-size: 1.4em; }
  .track-item-subtitle { font-size: 1.19em; opacity: 0.75; margin-top: 2px; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<div class="app-wrapper">

  <span class="sr-only" id="appDesc">Player de audiodescrição com playlist. A faixa em reprodução e os controles ficam fixos no topo; a lista de faixas rola abaixo.</span>

  <div class="top-title-bar">
    <h1>Caminhos do Sagrado Greco-Goiano</h1>
  </div>

  <div class="top-panel">

    <div class="now-playing">
      <img class="cover-thumb" id="coverImage" src="" alt="" aria-hidden="true" loading="lazy" decoding="async">
      <div class="now-playing-info">
        <div class="track-title" id="trackLabel">—</div>
        <div class="status-row">
          <span class="status-icon" id="statusIcon" aria-hidden="true">❚❚</span>
          <span class="status-text" id="status" aria-live="polite">Pausado</span>
        </div>
      </div>
    </div>

    <div class="primary-controls">
      <button class="icon-btn" id="prevBtn" aria-label="Faixa anterior">⏮</button>
      <button class="play-circle-btn" id="playBtn" aria-pressed="false" aria-label="Reproduzir ou pausar">
        <span id="playIcon" aria-hidden="true">▶</span>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="Próxima faixa">⏭</button>
    </div>

    <div class="skip-row">
      <button class="btn-skip" id="rewindBtn" aria-label="Voltar 15 segundos">
        <span class="icon" aria-hidden="true">«</span>15s
      </button>
      <button class="btn-skip speed-btn" id="speedBtn" aria-label="Velocidade de reprodução: 1x. Toque para alterar.">1x</button>
      <button class="btn-skip" id="forwardBtn" aria-label="Avançar 15 segundos">
        15s<span class="icon" aria-hidden="true">»</span>
      </button>
    </div>

  </div>

  <div class="playlist-scroll" id="playlist" role="list" aria-label="Lista de faixas"></div>

</div>

<script>
const playlist = [
  { title: "Texto curatorial",                          audioUrl: "https://static.wixstatic.com/mp3/3fe01e_2e13aef6c5ca41e884ea478bbb42d646.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_5f651cfd799243f19c15f33485f10441~mv2.png" },
  { title: "Paulo Desana",                               audioUrl: "https://static.wixstatic.com/mp3/3fe01e_d1bad34e1e364f229329c310ca5ffb90.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_af86c9d6d6924a2c9d9644252d892061~mv2.png" },
  { title: "Ziel Karapoto & Olinda Tupinambá",           audioUrl: "https://static.wixstatic.com/mp3/3fe01e_21a9f37956854125b82d9ee022319cf0.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_6888b0fc76794907a5933672af9cdd0e~mv2.png" },
  { title: "Vilmone Guarani",                            audioUrl: "https://static.wixstatic.com/mp3/3fe01e_b5ff9d872c574ce5ba2fd26b70e8b2f5.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_f91af4667da84ef09c06407ba83a3d58~mv2.png" },
  { title: "Mandacaru Karajá",                           audioUrl: "https://static.wixstatic.com/mp3/3fe01e_98299c9b0b86487a96be91746f016689.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_dbf598355e594da092c439f448254970~mv2.png" },
  { title: "Glicéria Tupinambá",                         audioUrl: "https://static.wixstatic.com/mp3/3fe01e_83b0ac4718004619b9b4801c21f2788a.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_f903efe5ab084d9b93b7430f9367f06a~mv2.png" },
  { title: "Sioduhi Waíkhʉn",                            audioUrl: "https://static.wixstatic.com/mp3/3fe01e_94fa8b7f84914289b9b623de3d4f172b.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_849d7e71650347738dccc5644aa10e57~mv2.png" },
  { title: "Ana Maria Kariri",                           audioUrl: "https://static.wixstatic.com/mp3/3fe01e_e915b064b8614ed7bb8ff988926bfce5.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_7d59798216ff4dce8b6c907277122861~mv2.png" },
  { title: "Ypituna Pankararu",                          audioUrl: "https://static.wixstatic.com/mp3/3fe01e_e5fd762e83d64669bab7ebafc3bed908.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_8f06870da43645f3ae718ccd3640fbce~mv2.png" },
  { title: "Luakam Anambé",                              audioUrl: "https://static.wixstatic.com/mp3/3fe01e_561a223eaef443708685e441e24be469.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_408bcc5ae04941e994d7bdeca1c3fa71~mv2.png" },
  { title: "Mandú",                                      audioUrl: "https://static.wixstatic.com/mp3/3fe01e_1d731d0c1ebf44ed9948098ad9883a0b.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_e7ee28450e9b4f049e49a9cecab13669~mv2.png" },
  { title: "Kuenan Mayu",                                audioUrl: "https://static.wixstatic.com/mp3/3fe01e_3f0a9e5b42d5407f9f473d68a5a48a5a.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_a156107bf5fd472989c35f0c1f8772b1~mv2.png" },
  { title: "Keyla Palikur",                              audioUrl: "https://static.wixstatic.com/mp3/3fe01e_cd85439182ce48f3b7a03874f79f32d2.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_a3ccaaccbf2141e8b72974ca1ec88e9f~mv2.png" },
  { title: "Ficha técnica",                              audioUrl: "https://static.wixstatic.com/mp3/3fe01e_8f091c8296034f7bafb7b34200b3d2ee.mp3", coverUrl: "https://static.wixstatic.com/media/3fe01e_2922883410b341f698ff8c72381d87bd~mv2.png" }
];

const SPEEDS = [1, 1.5, 2, 0.75];
let speedIndex = 0; // começa em 1x

let currentTrack = 0, playing = false;
const audio           = new Audio();
const playBtn          = document.getElementById('playBtn');
const playIcon          = document.getElementById('playIcon');
const trackLabel         = document.getElementById('trackLabel');
const statusIcon            = document.getElementById('statusIcon');
const status                  = document.getElementById('status');
const cover                    = document.getElementById('coverImage');
const playlistDiv                = document.getElementById('playlist');
const speedBtn                     = document.getElementById('speedBtn');
const rewindBtn                      = document.getElementById('rewindBtn');
const forwardBtn                       = document.getElementById('forwardBtn');
const prevBtn                            = document.getElementById('prevBtn');
const nextBtn                              = document.getElementById('nextBtn');

function pad(n) { return String(n).padStart(2, '0'); }

function loadTrack(index, autoplay = true) {
  const track = playlist[index];
  audio.src = track.audioUrl;
  audio.playbackRate = SPEEDS[speedIndex];

  if (track.coverUrl) {
    cover.src = track.coverUrl;
    cover.classList.remove('hidden');
  } else {
    cover.removeAttribute('src');
    cover.classList.add('hidden');
  }

  trackLabel.textContent = `${pad(index + 1)} - ${track.title}`;
  playBtn.setAttribute('aria-label', `${track.title} — reproduzir ou pausar`);
  highlightTrack(index);
  setPlaying(false);
  if (autoplay) {
    audio.play().then(() => setPlaying(true)).catch(() => {});
  }
}

function setPlaying(isPlaying) {
  playing = isPlaying;
  playBtn.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
  playBtn.classList.toggle('is-playing', isPlaying);

  // ícone dentro do botão central: alterna entre play e pause conforme a ação disponível
  playIcon.textContent = isPlaying ? '❚❚' : '▶';

  // indicador de status: mostra o símbolo que representa o estado atual
  statusIcon.textContent = isPlaying ? '▶' : '❚❚';
  status.textContent = isPlaying ? 'Reproduzindo' : 'Pausado';

  status.classList.toggle('playing', isPlaying);
  status.classList.toggle('paused', !isPlaying);
  statusIcon.classList.toggle('playing', isPlaying);
  statusIcon.classList.toggle('paused', !isPlaying);
}

function highlightTrack(index) {
  document.querySelectorAll('.track-item').forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });
}

function setSpeed(index) {
  speedIndex = ((index % SPEEDS.length) + SPEEDS.length) % SPEEDS.length;
  const rate = SPEEDS[speedIndex];
  audio.playbackRate = rate;
  const label = `${rate}x`.replace('.', ',');
  speedBtn.textContent = label;
  speedBtn.setAttribute('aria-label', `Velocidade de reprodução: ${label}. Toque para alterar.`);
}

function createPlaylist() {
  playlist.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'track-item';
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'listitem button');
    item.setAttribute('aria-label', `Faixa ${i + 1}: ${track.title}`);
    item.innerHTML = `
      <span class="track-item-title">Faixa ${i + 1}</span>
      <span class="track-item-subtitle">${track.title}</span>`;
    item.onclick = () => { currentTrack = i; loadTrack(i); };
    item.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { currentTrack = i; loadTrack(i); e.preventDefault(); }
    };
    playlistDiv.appendChild(item);
  });
}

function getTrackFromURL() {
  const params = new URLSearchParams(window.location.search);
  const n = parseInt(params.get('faixa'));
  if (!isNaN(n) && n >= 1 && n <= playlist.length) return n - 1;
  return 0;
}

window.addEventListener('message', (event) => {
  if (event.data && event.data.faixaIndex !== undefined) {
    currentTrack = event.data.faixaIndex;
    loadTrack(currentTrack);
  }
});

playBtn.addEventListener('click', () => {
  if (audio.paused) { audio.play().then(() => setPlaying(true)).catch(() => {}); }
  else { audio.pause(); setPlaying(false); }
});

rewindBtn.addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 15);
});
forwardBtn.addEventListener('click', () => {
  const dur = isFinite(audio.duration) ? audio.duration : audio.currentTime + 15;
  audio.currentTime = Math.min(dur, audio.currentTime + 15);
});

speedBtn.addEventListener('click', () => setSpeed(speedIndex + 1));

prevBtn.onclick = () => {
  currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
  loadTrack(currentTrack);
};
nextBtn.onclick = () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  loadTrack(currentTrack);
};

audio.addEventListener('play',  () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('ended', () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  loadTrack(currentTrack);
});

createPlaylist();
setSpeed(speedIndex);
currentTrack = getTrackFromURL();
loadTrack(currentTrack, false);
</script>
</body>
</html>
